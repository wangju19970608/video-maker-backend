server.port=8085
spring.application.name=video-maker-extractor-service
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.main.allow-bean-definition-overriding=true

# Feign timeout config
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=30000

# Environment Configuration: dev = Development (Local Windows), prod = Production (Linux Server)
spring.profiles.active=dev
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=150MB

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/birthday_video_maker?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Douyin (TikTok) Mini Program Configuration for this specific Video Extractor App
extractor.douyin.app-id=tt488c3e31d6e8adaa01
extractor.douyin.app-secret=c02c808be8b2ce571e80a61de76892f6092e8b1d

# ASR (Speech-to-Text) configuration: Whisper API Key (Optional)
# If empty, a simulated speech extraction will be returned.
extractor.whisper.api-key=
extractor.whisper.api-url=https://api.openai.com/v1/audio/transcriptions

# ==================== Video Processing Tool Path Configuration ====================
# Is Online Environment: true = Production (Linux), false = Development (Windows)
video.isOnline=false
# Development Environment (Windows) Paths
video.ffmpeg.path.dev=ffmpeg/bin/ffmpeg.exe
# Production Environment (Linux) Paths
video.ffmpeg.path.prod=/usr/bin/ffmpeg
